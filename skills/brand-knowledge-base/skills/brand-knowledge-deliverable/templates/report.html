<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{report_title}}</title>
<style>
  :root{
    --ink:#1c2530; --ink2:#4a5563; --ink3:#8b96a5;
    --line:#e3e7ed; --bg:#ffffff; --bg2:#f6f8fa;
    --brand:#12466b; --brand-l:#eaf2f8; --accent:#b5611a; --accent-l:#fdf3ea;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:0; background:var(--bg2); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px; line-height:1.75;
  }
  .page{
    max-width:820px; margin:0 auto; background:var(--bg);
    min-height:100vh; display:flex; flex-direction:column;
  }
  .head{padding:44px 52px 26px; border-bottom:2px solid var(--brand);}
  .kicker{
    font-size:12px; letter-spacing:.14em; color:var(--accent);
    font-weight:600; text-transform:uppercase; margin-bottom:12px;
  }
  h1{margin:0 0 14px; font-size:26px; line-height:1.35; font-weight:600; color:var(--brand);}
  .meta{font-size:12.5px; color:var(--ink3);}
  .meta span{margin-right:18px;}
  main{padding:34px 52px 8px; flex:1;}
  h2{
    font-size:17px; font-weight:600; color:var(--brand);
    margin:34px 0 12px; padding-left:11px; border-left:3px solid var(--accent);
  }
  h2:first-child{margin-top:0;}
  h3{font-size:14.5px; font-weight:600; margin:22px 0 8px; color:var(--ink);}
  p{margin:0 0 12px;}
  ul,ol{margin:0 0 14px; padding-left:22px;}
  li{margin-bottom:6px;}
  strong{font-weight:600; color:var(--ink);}
  table{width:100%; border-collapse:collapse; margin:14px 0 18px; font-size:13px;}
  th{
    background:var(--brand-l); color:var(--brand); font-weight:600;
    text-align:left; padding:9px 11px; border:1px solid var(--line);
  }
  td{padding:9px 11px; border:1px solid var(--line); vertical-align:top;}
  tbody tr:nth-child(even){background:#fbfcfd;}
  .lead{
    background:var(--accent-l); border-left:3px solid var(--accent);
    padding:14px 18px; margin:0 0 22px; font-size:14.5px; color:var(--ink);
  }
  .note{font-size:12.5px; color:var(--ink2); background:var(--bg2); padding:11px 14px; border-radius:4px; margin:14px 0;}

  footer{
    margin-top:38px; padding:26px 52px 30px;
    border-top:1px solid var(--line); background:#fafbfc;
  }
  .f-grid{display:grid; grid-template-columns:1fr 352px; align-items:start;}
  .f-left{padding-right:34px;}
  .f-right{border-left:1px solid var(--line); padding-left:34px;}
  .f-brand{font-size:12.5px; color:var(--ink2); margin-bottom:10px;}
  .f-brand b{color:var(--brand); font-weight:600;}
  .f-hook{font-size:12.5px; color:var(--ink2); line-height:1.7; margin-bottom:10px;}
  .f-note{font-size:11.5px; color:var(--ink3); line-height:1.7;}
  .f-meta{font-size:11.5px; color:var(--ink3); line-height:1.8;}

  @media (max-width:640px){
    .f-grid{grid-template-columns:1fr;}
    .f-left{padding-right:0; padding-bottom:20px;}
    .f-right{border-left:0; border-top:1px solid var(--line); padding-left:0; padding-top:20px;}
  }
  @page{size:A4; margin:14mm 0;}
  @media print{
    body{background:#fff;}
    .page{max-width:none; min-height:auto;}
    footer{background:#fff;}
    h2{break-after:avoid;}
    table{break-inside:auto;}
    tr{break-inside:avoid;}
    .f-grid{grid-template-columns:1fr 360px;}
    .f-left,.f-right{break-inside:avoid;}
  }

  .ev{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap;}
  .ev-ok{background:#e9f6f1;color:#1f7a5f;}
  .ev-wait{background:#fdf3ea;color:#b5611a;}
  .ev-in{background:#eef2f6;color:#4a5563;}
  .ev-no{background:#fdeceb;color:#b3281a;}
  th{white-space:nowrap;}
  td .ev{white-space:nowrap;}
  .gap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 18px;}
  .gap>div{border:1px solid var(--line);border-radius:6px;padding:11px 13px;font-size:12.5px;line-height:1.7;}
  .gap b{display:block;font-size:12px;letter-spacing:.06em;margin-bottom:5px;}
  .g-wrong b{color:#b3281a;}
  .g-miss b{color:#b5611a;}
  .g-off b{color:#4a5563;}
  .mod{border:1px solid var(--line);border-radius:6px;padding:12px 15px;margin:10px 0;}
  .mod-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13.5px;font-weight:600;color:var(--brand);margin-bottom:7px;}
  .mod-h span{font-size:11.5px;font-weight:400;color:var(--ink3);white-space:nowrap;}
  .mod p{margin:0 0 6px;font-size:13px;}
  .qa{border-left:3px solid #d8e6f0;padding:7px 0 7px 14px;margin:0 0 13px;}
  .qa b{display:block;font-weight:600;font-size:13.5px;color:var(--brand);margin-bottom:5px;}
  .qa p{margin:0;font-size:13.5px;}
  .frame{margin:14px 0 18px;}
  .f-root{display:table;margin:0 auto;background:var(--brand);color:#fff;font-size:13px;font-weight:600;padding:6px 18px;border-radius:5px;}
  .f-spine{width:1px;height:13px;background:var(--line);margin:0 auto;}
  .f-branches{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .f-branch{border:1px solid var(--line);border-radius:6px;padding:11px 13px;}
  .f-bhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;font-weight:600;color:var(--brand);margin-bottom:8px;}
  .f-bhead span{font-size:11px;font-weight:400;color:var(--ink3);white-space:nowrap;}
  .f-items{display:flex;flex-wrap:wrap;gap:5px;}
  .f-items span{font-size:11.5px;color:var(--ink2);background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:2px 8px;line-height:1.65;}
  @media (max-width:640px){.gap{grid-template-columns:1fr;}.f-branches{grid-template-columns:1fr;}}
  @media print{.mod,.qa,.gap,.frame{break-inside:avoid;}}
</style>
</head>
<body>
<div class="page">

  <header class="head">
    <div class="kicker">品牌知识库搭建方案 · {{client_industry}}</div>
    <h1>{{report_title}}</h1>
    <div class="meta">
      <span>生成时间：{{generated_at}}</span>
      <span>出品：数珀AI 提供的 品牌知识库搭建专家团</span>
    </div>
  </header>

  <main>
    {{content}}
  </main>

  <footer>
    <div class="f-grid">
      <div class="f-left">
        <div class="f-brand">本报告由 <b>数珀AI 提供的 品牌知识库搭建专家团</b> 出品</div>
        <div class="f-meta">
          数据口径：{{data_scope}}<br>
          样本来源：{{sample_source}}<br>
          生成时间：{{generated_at}}<br>
          官网：www.suproai.com
        </div>
      </div>
      <div class="f-right">
        <div class="f-hook">{{scope_note}}</div>
        <div class="f-note">本方案为一次性交付物：不含账号代管、后台数据接入、持续维护与实施服务。</div>
      </div>
    </div>
  </footer>

</div>
</body>
</html>
