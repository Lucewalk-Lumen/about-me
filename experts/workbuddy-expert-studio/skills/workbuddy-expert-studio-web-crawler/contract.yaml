# contract.yaml — workbuddy-expert-studio-web-crawler 确定性配置唯一事实源
# crawler.py / search.py 从这里读取参数，不硬编码。
contract_version: "1.0.0"

crawl:
  user_agent: "Mozilla/5.0 (compatible; workbuddy-expert-studio-web-crawler/1.0.0; +https://workbuddy.cn)"
  timeout_seconds: 15
  retries: 2
  backoff_base_seconds: 1.5      # 退避 = backoff_base * (2 ** attempt)
  max_bytes: 2000000             # 超过则截断，避免内存爆
  respect_robots: true
  follow_redirects: true          # 由 crawler._SafeRedirectHandler 真正生效（非死配置）
  max_redirects: 5                # 逐跳重定向上限；每一跳目标均过 _check_url 校验，防「公网 302 到内网」
  prefer_browser: edge            # 运行时优先检测并调用本机已安装的 Edge 无头渲染；未安装则回退 urllib（绝不下载 Chrome）
  allow_no_sandbox: false         # 默认关闭；置 true 会摘掉 Edge 渲染进程沙箱（仅 root/容器按需），开启即放弃沙箱
  from_file_max_bytes: 10485760   # --from-file 单文件上限（10 MB），超限返回 file_too_large
  from_file_allow_dirs: ""        # 逗号分隔的额外允许目录；须落在 CWD/PKG_ROOT 内才生效（防止放宽越界）
  # --from-file 有效允许根 = CWD ∪ PKG_ROOT ∪ 上面的 from_file_allow_dirs
  #   ∪（仅当 realpath 落在 CWD 或 PKG_ROOT 内的 --allow-dir）。单个 CLI --allow-dir 无法把边界放宽到项目外。

search:
  provider: duckduckgo_lite      # 尽力式；网络受限时优雅失败
  endpoint: "https://lite.duckduckgo.com/lite/"
  max_results: 10
  timeout_seconds: 15

# 采集双轨（crawler 自带 Edge 无头渲染，browser-skill 为可选平台兜底，非第三方依赖）
# 纯静态/官方文档 → crawler.py urllib 直取；JS重度/SPA → crawler.py 自动调本机 Edge 渲染（prefer_browser: edge）；登录态/交互 → browser-skill 渲染后 crawler.py --from-file 抽取
prefer:
  static_docs: crawler
  dynamic_or_logged_in: browser-skill   # 仅限登录态/交互页；SPA 已由 crawler 经 Edge 自渲染
  fallback: crawler

# 错误分类（输出 error_type 字段，便于上游区分处理，不裸奔崩溃）
error_taxonomy:
  - url_denied          # URL 未过 _check_url 准入（scheme 非 http(s)；内网·回环·链路本地·保留·多播·CGNAT 100.64/10·云元数据；DNS 解析到内网；重定向被拒/超 max_redirects）
  - path_denied         # --from-file 路径不在允许工作区（CWD/PKG_ROOT）内，或非普通文件，或 --allow-dir 越出项目
  - file_too_large      # --from-file 超过 from_file_max_bytes
  - non_text_file       # --from-file 命中二进制内容（含 NUL 字节）
  - bad_args            # 显式传入空 URL / 空 --from-file / 空 query（与「完全不带参数跑 self-test」区分）
  - network_timeout
  - http_error
  - encoding_error
  - non_html
  - robots_disallowed
  - empty_body
  - unknown
