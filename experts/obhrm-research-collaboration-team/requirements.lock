# requirements.lock — obhrm-research-collaboration-team（Python 第三方依赖，精确锁定）
#
# 本文件列出本专家团**刻意声明并锁定**的外部运行时依赖（并非隐藏或可选残留）：
#   · 绘图/图表：matplotlib, seaborn, numpy, scipy
#   · 文档/PDF：python-docx, pypdf, pdfplumber, Pillow
#
# 全部版本均为 PyPI 上真实存在、可复现的精确版本。
# 运行时前置：宿主 Python 需先执行 `pip install -r requirements.lock`；
# 未安装时，对应脚本会打印明确的安装提示并以退出码 1 终止（绝不静默失败）。
# 包内不含这些二进制/库，也不含任何自动安装逻辑。
#
# 未使用的包（requests / pandas 等）不在本清单内。

